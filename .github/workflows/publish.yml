name: Publish
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      IN_ROLE_TO_ASSUME:
        description: 'The ARN of the role to assume in the target AWS account'
        required: true
        default: 'arn:aws:iam::568614420041:role/GitHubAction-AssumeRoleWithAction'
      IN_AWS_REGION:
        description: 'The AWS region where the ECR repository is located'
        required: true
        default: 'us-east-1'
      IN_ECR_REPOSITORY:
       description: 'The name of the ECR repository (without the full URI)'
       required: true
       default: 'provar-playwright-mcp'
jobs:
  publish-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get current version
        id: generate-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials for GitRepos Account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.IN_ROLE_TO_ASSUME }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ inputs.IN_AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build, tag, and push ARM64 image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          VERSION: ${{ steps.generate-version.outputs.version }}
        run: |
          # Build ARM64-only image for AWS Agent Core
          docker buildx build \
            --platform linux/arm64 \
            -t $ECR_REGISTRY/${{ inputs.IN_ECR_REPOSITORY }}:$VERSION \
            --push .
          
          # Set output
          echo "image=$ECR_REGISTRY/${{ inputs.IN_ECR_REPOSITORY }}:$VERSION" >> $GITHUB_OUTPUT
          
          # Log the image details
          echo "Built and pushed ARM64 image for AWS Agent Core: $ECR_REGISTRY/${{ inputs.IN_ECR_REPOSITORY }}:$VERSION"

  
